name = "ssclip-relay"
main = "src/index.js"
compatibility_date = "2025-06-01"

# 先运行 `npx wrangler d1 create ssclip-relay`，把输出里的 database_id 填到这里。
[[d1_databases]]
binding = "DB"
database_name = "ssclip-relay"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

# 持有 WebSocket 连接、把“有新消息”推给在线设备。连接空闲时会休眠，不计时长。
[[durable_objects.bindings]]
name = "HUB"
class_name = "RelayHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RelayHub"]

[vars]
# 没有消息时把 poll 请求挂住的秒数（长轮询）。0 表示立即返回；客户端超时是 12 秒，不要超过 8。
LONG_POLL_SECONDS = "6"

# 每小时清理一次过期正文；平时每个请求也会顺带清理。
[triggers]
crons = ["17 * * * *"]

[observability]
enabled = true
