name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: macos-15
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Show Swift version and verify Apple Silicon runner
        run: |
          swift --version
          test "$(uname -m)" = arm64

      - name: Verify bundled shortcut semantics and native regex
        run: |
          python3 Shortcuts/validate_shortcuts.py
          python3 Shortcuts/test_persistence_actions.py
          swift scripts/test-shortcut-regex.swift
          swift scripts/test-shortcut-file-contract.swift
          cmp Resources/SSClip-Send.unsigned.shortcut Shortcuts/SSClip-Send.ssclip-template

      - name: Run tests
        run: swift test

  build:
    name: Build app
    needs: test
    runs-on: macos-15
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build and package app
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: bash scripts/package.sh

      - name: Verify checksums
        working-directory: dist
        run: shasum -a 256 -c SSClip-*.sha256

      - name: Verify bundled iPhone shortcut template
        env:
          APP: .build/stage-${{ github.run_number }}/SSClip.app
        run: |
          test ! -e "$APP/Contents/Resources/SSClip-Settings.unsigned.shortcut"
          cmp Shortcuts/SSClip-Send.ssclip-template "$APP/Contents/Resources/SSClip-Send.unsigned.shortcut"
          printf "%s\n" "$GITHUB_SHA" > SSClip-build-commit.txt

      - name: Smoke launch packaged app with relay off by default
        env:
          APP: .build/stage-${{ github.run_number }}/SSClip.app
        run: |
          "$APP/Contents/MacOS/SSClip" --show-settings &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT
          sleep 3
          kill -0 "$APP_PID"

      - name: Prepare independently downloadable iPhone template
        run: |
          cp Shortcuts/SSClip-Send.ssclip-template SSClip-Send.ssclip-template
          shasum -a 256 SSClip-Send.ssclip-template > SSClip-Send.ssclip-template.sha256

      - name: Upload independent iPhone template
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: SSClip-iPhone-Template
          path: |
            SSClip-Send.ssclip-template
            SSClip-Send.ssclip-template.sha256
            SSClip-build-commit.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SSClip-macOS
          path: dist/SSClip-*
          if-no-files-found: error
          retention-days: 14

  relay-worker:
    name: Relay worker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: relay-worker

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
