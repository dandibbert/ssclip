name: CI

on:
  push:
    branches:
      - main
      - codex/ssclip-relay-test
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: macos-15
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Show Swift version and verify Apple Silicon runner
        run: |
          swift --version
          test "$(uname -m)" = arm64

      - name: Verify bundled shortcut semantics and native regex
        run: |
          python3 Shortcuts/validate_shortcuts.py
          swift scripts/test-shortcut-regex.swift

      - name: Run tests
        run: swift test

  build:
    name: Build app
    needs: test
    runs-on: macos-15
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build app bundle
        run: ./scripts/build-app.sh

      - name: Verify Apple Silicon app
        run: |
          test "$(lipo -archs dist/SSClip.app/Contents/MacOS/SSClip)" = arm64
          codesign --verify --deep --strict dist/SSClip.app
          test ! -e dist/SSClip.app/Contents/Resources/SSClip-Settings.unsigned.shortcut
          swift -e 'import Foundation; let b = Bundle(path: CommandLine.arguments[1])!; for n in ["SSClip-Send"] { guard let u = b.url(forResource: n, withExtension: "unsigned.shortcut"), let d = try? Data(contentsOf: u), !d.isEmpty else { fatalError("Missing bundled shortcut template") }; print(n + ": resource lookup OK") }' dist/SSClip.app
          printf "%s\n" "$GITHUB_SHA" > SSClip-build-commit.txt

      - name: Smoke launch packaged app with relay off by default
        run: |
          dist/SSClip.app/Contents/MacOS/SSClip --show-settings &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT
          sleep 3
          kill -0 "$APP_PID"

      - name: Package app and checksum
        run: |
          ditto -c -k --sequesterRsrc --keepParent dist/SSClip.app SSClip-macOS.zip
          shasum -a 256 SSClip-macOS.zip > SSClip-macOS.zip.sha256
          shasum -a 256 -c SSClip-macOS.zip.sha256

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SSClip-macOS
          path: |
            SSClip-macOS.zip
            SSClip-macOS.zip.sha256
            SSClip-build-commit.txt
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: SSClip-macOS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          --repo "$GITHUB_REPOSITORY"
          SSClip-macOS.zip
          SSClip-macOS.zip.sha256
          --verify-tag
          --title "SSClip $GITHUB_REF_NAME"
          --generate-notes
